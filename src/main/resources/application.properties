spring.application.name=aprendiendo
sever.port=8080

# Database connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/practica
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate properties (for ORM if you're using Spring Data JPA)
spring.jpa.hibernate.ddl-auto=create-drop

# Ayuda para las convenciones JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración JWT (usa solo un conjunto de propiedades)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Configuración adicional (opcional anterior guia)
app.auth.username=alex
app.auth.password=1234

#Para documentacion
springdoc.api-docs.path=/api-docs

